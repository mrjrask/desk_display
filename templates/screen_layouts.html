<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen Layout Editor</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      --panel-bg: rgba(15, 23, 42, 0.92);
      --panel-border: rgba(148, 163, 184, 0.2);
      --panel-shadow: 0 30px 60px rgba(15, 23, 42, 0.5);
      --card-bg: rgba(15, 23, 42, 0.72);
      --field-bg: rgba(15, 23, 42, 0.65);
      --field-border: rgba(148, 163, 184, 0.3);
    }
    body {
      margin: 0;
      padding: 1.5rem;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.1), transparent 35%), #0f172a;
      box-sizing: border-box;
    }
    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }
    header {
      text-align: center;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
    }
    .subtitle {
      color: #94a3b8;
      margin: 0 0 1rem;
      font-size: 0.95rem;
    }
    .nav-links {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .nav-links a {
      color: #e2e8f0;
      text-decoration: none;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.65);
      font-size: 0.85rem;
    }
    .panel {
      max-width: 1300px;
      margin: 0 auto;
      background: var(--panel-bg);
      border-radius: 20px;
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      padding: clamp(1.25rem, 2.5vw, 2rem);
      backdrop-filter: blur(12px);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .toolbar .status {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-weight: 700;
      cursor: pointer;
      background: #38bdf8;
      color: #0f172a;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.3);
    }
    .btn:hover {
      transform: translateY(-1px);
    }
    .btn-secondary {
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.6);
    }
    .layout-grid {
      display: grid;
      grid-template-columns: minmax(220px, 260px) minmax(0, 1fr);
      gap: 1.5rem;
    }
    @media (max-width: 960px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
    }
    .screen-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.75rem;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.7);
      max-height: 70vh;
      overflow-y: auto;
    }
    .screen-button {
      border: 1px solid transparent;
      background: rgba(30, 41, 59, 0.7);
      color: #e2e8f0;
      padding: 0.55rem 0.85rem;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      font-size: 0.9rem;
    }
    .screen-button.active {
      border-color: rgba(56, 189, 248, 0.7);
      background: rgba(56, 189, 248, 0.15);
      color: #f8fafc;
      font-weight: 600;
    }
    .resolution-grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .resolution-card {
      background: var(--card-bg);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .resolution-header {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: baseline;
    }
    .resolution-header h3 {
      margin: 0;
      font-size: 1rem;
      color: #f8fafc;
    }
    .resolution-size {
      color: #94a3b8;
      font-size: 0.8rem;
    }
    .preview-shell {
      position: relative;
      width: 100%;
      padding-top: calc(var(--preview-ratio) * 100%);
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.6);
      overflow: hidden;
    }
    .preview-canvas {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: calc(6px * var(--spacing-scale));
      padding: calc(10px * var(--spacing-scale));
      font-size: calc(12px * var(--font-scale));
      color: #e2e8f0;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      gap: calc(8px * var(--spacing-scale));
      font-weight: 600;
    }
    .preview-title {
      font-size: calc(14px * var(--font-scale));
    }
    .preview-subtitle {
      font-size: calc(10px * var(--font-scale));
      color: #94a3b8;
    }
    .preview-body {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: calc(8px * var(--spacing-scale));
      align-items: center;
      flex: 1;
    }
    .preview-image {
      width: calc(58px * var(--image-scale));
      height: calc(42px * var(--image-scale));
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.6), rgba(34, 197, 94, 0.5));
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.4);
    }
    .preview-lines {
      display: flex;
      flex-direction: column;
      gap: calc(4px * var(--spacing-scale));
    }
    .preview-line {
      height: calc(6px * var(--font-scale));
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.4);
    }
    .preview-line.short {
      width: 60%;
    }
    .preview-footer {
      font-size: calc(10px * var(--font-scale));
      color: #94a3b8;
      text-align: right;
    }
    .control-group {
      display: grid;
      gap: 0.35rem;
    }
    label {
      font-size: 0.8rem;
      color: #cbd5f5;
      font-weight: 600;
    }
    .control-inputs {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 0.5rem;
      align-items: center;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }
    input[type="number"] {
      padding: 0.4rem 0.55rem;
      border-radius: 10px;
      border: 1px solid var(--field-border);
      background: var(--field-bg);
      color: #e2e8f0;
      font-size: 0.85rem;
    }
    .error {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(248, 113, 113, 0.6);
      background: rgba(248, 113, 113, 0.15);
      color: #fecaca;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Screen Layout Editor</h1>
    <p class="subtitle">Tune each screen for every supported resolution with live layout previews.</p>
    <nav class="nav-links">
      <a href="/">Rotation Config</a>
      <a href="/screenshots">Screenshots</a>
      <a href="/layouts">Layout Editor</a>
    </nav>
  </header>

  <main class="panel">
    <div class="error" id="error"></div>
    <div class="toolbar">
      <div>
        <div class="status" id="status">Select a screen to begin editing.</div>
      </div>
      <div class="actions">
        <button class="btn" id="saveButton">Save Layouts</button>
        <button class="btn-secondary" id="exportButton">Export</button>
        <label class="btn-secondary" for="importFile">Import</label>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>

    <div class="layout-grid">
      <div class="screen-list" id="screenList"></div>
      <div>
        <div class="resolution-grid" id="resolutionGrid"></div>
      </div>
    </div>
  </main>

  <script>
    const screenIds = {{ screen_ids | tojson }};
    const resolutionOptions = {{ resolutions | tojson }};
    const initialLayouts = {{ layouts | tojson }};

    let activeScreenId = screenIds[0] || null;
    let layouts = JSON.parse(JSON.stringify(initialLayouts || {}));

    const errorEl = document.getElementById('error');
    const statusEl = document.getElementById('status');
    const screenListEl = document.getElementById('screenList');
    const resolutionGridEl = document.getElementById('resolutionGrid');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function clearError() {
      errorEl.textContent = '';
      errorEl.style.display = 'none';
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function buildScreenList() {
      screenListEl.innerHTML = '';
      screenIds.forEach((screenId) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'screen-button';
        button.textContent = screenId;
        if (screenId === activeScreenId) {
          button.classList.add('active');
        }
        button.addEventListener('click', () => {
          activeScreenId = screenId;
          buildScreenList();
          renderResolutionCards();
        });
        screenListEl.appendChild(button);
      });
    }

    function formatScale(value) {
      return Number.parseFloat(value).toFixed(2);
    }

    function applyPreviewStyles(preview, settings) {
      preview.style.setProperty('--font-scale', settings.font_scale);
      preview.style.setProperty('--image-scale', settings.image_scale);
      preview.style.setProperty('--spacing-scale', settings.spacing_scale);
    }

    function createScaleControl(label, value, onChange) {
      const wrapper = document.createElement('div');
      wrapper.className = 'control-group';
      const labelEl = document.createElement('label');
      labelEl.textContent = label;
      const inputs = document.createElement('div');
      inputs.className = 'control-inputs';
      const range = document.createElement('input');
      range.type = 'range';
      range.min = '0.25';
      range.max = '4.0';
      range.step = '0.05';
      range.value = value;
      const number = document.createElement('input');
      number.type = 'number';
      number.min = '0.25';
      number.max = '4.0';
      number.step = '0.05';
      number.value = formatScale(value);

      const handleUpdate = (nextValue) => {
        const parsed = Number.parseFloat(nextValue);
        if (Number.isNaN(parsed)) {
          return;
        }
        const clamped = Math.min(4.0, Math.max(0.25, parsed));
        range.value = clamped;
        number.value = formatScale(clamped);
        onChange(clamped);
      };

      range.addEventListener('input', (event) => handleUpdate(event.target.value));
      number.addEventListener('change', (event) => handleUpdate(event.target.value));

      inputs.appendChild(range);
      inputs.appendChild(number);
      wrapper.appendChild(labelEl);
      wrapper.appendChild(inputs);
      return wrapper;
    }

    function renderResolutionCards() {
      resolutionGridEl.innerHTML = '';
      if (!activeScreenId) {
        setStatus('No screens available.');
        return;
      }
      const screenLayouts = layouts[activeScreenId] || {};
      setStatus(`Editing layouts for "${activeScreenId}".`);

      resolutionOptions.forEach((resolution) => {
        const settings = screenLayouts[resolution.id] || {
          font_scale: 1,
          image_scale: 1,
          spacing_scale: 1,
        };

        const card = document.createElement('div');
        card.className = 'resolution-card';

        const header = document.createElement('div');
        header.className = 'resolution-header';
        const title = document.createElement('h3');
        title.textContent = resolution.label;
        const size = document.createElement('span');
        size.className = 'resolution-size';
        size.textContent = `${resolution.width}×${resolution.height}`;
        header.appendChild(title);
        header.appendChild(size);

        const previewShell = document.createElement('div');
        previewShell.className = 'preview-shell';
        previewShell.style.setProperty('--preview-ratio', resolution.height / resolution.width);

        const previewCanvas = document.createElement('div');
        previewCanvas.className = 'preview-canvas';
        previewCanvas.innerHTML = `
          <div class="preview-header">
            <div class="preview-title">${activeScreenId}</div>
            <div class="preview-subtitle">Layout preview</div>
          </div>
          <div class="preview-body">
            <div class="preview-image"></div>
            <div class="preview-lines">
              <div class="preview-line"></div>
              <div class="preview-line short"></div>
              <div class="preview-line"></div>
            </div>
          </div>
          <div class="preview-footer">Spacing + font scaling</div>
        `;
        applyPreviewStyles(previewCanvas, settings);
        previewShell.appendChild(previewCanvas);

        const fontControl = createScaleControl('Font scale', settings.font_scale, (value) => {
          settings.font_scale = value;
          applyPreviewStyles(previewCanvas, settings);
        });
        const imageControl = createScaleControl('Image scale', settings.image_scale, (value) => {
          settings.image_scale = value;
          applyPreviewStyles(previewCanvas, settings);
        });
        const spacingControl = createScaleControl('Spacing scale', settings.spacing_scale, (value) => {
          settings.spacing_scale = value;
          applyPreviewStyles(previewCanvas, settings);
        });

        card.appendChild(header);
        card.appendChild(previewShell);
        card.appendChild(fontControl);
        card.appendChild(imageControl);
        card.appendChild(spacingControl);

        resolutionGridEl.appendChild(card);
      });
    }

    async function saveLayouts() {
      clearError();
      try {
        const response = await fetch('/api/layouts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ layouts }),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || 'Failed to save layouts.');
        }
        layouts = payload.layouts || layouts;
        setStatus('Layouts saved successfully.');
      } catch (err) {
        showError(err.message);
      }
    }

    async function importLayouts(file) {
      clearError();
      if (!file) {
        return;
      }
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const response = await fetch('/api/layouts/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(parsed),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || 'Failed to import layouts.');
        }
        layouts = payload.layouts || layouts;
        renderResolutionCards();
        setStatus('Layouts imported successfully.');
      } catch (err) {
        showError(err.message);
      }
    }

    document.getElementById('saveButton').addEventListener('click', saveLayouts);
    document.getElementById('exportButton').addEventListener('click', () => {
      window.location.href = '/api/layouts/export';
    });
    document.getElementById('importFile').addEventListener('change', (event) => {
      importLayouts(event.target.files[0]);
      event.target.value = '';
    });

    buildScreenList();
    renderResolutionCards();
  </script>
</body>
</html>
