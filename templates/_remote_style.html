<style>
  :root {
    color-scheme: light dark;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  body {
    margin: 0;
    padding: 1.5rem;
    min-height: 100vh;
    background: radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.1), transparent 35%), #0f172a;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  h1 { text-align: center; margin: 0 0 0.5rem; font-size: clamp(1.6rem, 3vw, 2.3rem); }
  h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 1.25rem; font-size: 0.95rem; }
  .nav-links { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; margin: 0 auto 1.5rem; }
  .nav-links a {
    color: #e2e8f0; text-decoration: none; padding: 0.35rem 0.85rem; border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.4); background: rgba(15, 23, 42, 0.65); font-size: 0.85rem;
  }
  .nav-links a[aria-current="page"] { border-color: #38bdf8; }
  .panel {
    max-width: 1200px; margin: 0 auto 1.25rem; padding: 1.1rem; border-radius: 16px;
    background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.2);
  }
  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  input, select, textarea, button {
    font: inherit; color: inherit; background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 10px; padding: 0.45rem 0.6rem;
  }
  textarea { width: 100%; min-height: 18rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
  button { cursor: pointer; }
  button.primary { background: #0369a1; border-color: #0ea5e9; }
  button.danger { border-color: rgba(239, 68, 68, 0.7); color: #fecaca; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  th, td { text-align: left; padding: 0.45rem 0.5rem; border-bottom: 1px solid rgba(148, 163, 184, 0.15); vertical-align: top; }
  th { color: #94a3b8; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .muted { color: #94a3b8; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; border: 1px solid rgba(148, 163, 184, 0.4); }
  .badge.online, .badge.in_sync { border-color: #22c55e; color: #bbf7d0; }
  .badge.stale, .badge.pending_delivery, .badge.pending_acknowledgment, .badge.warning { border-color: #f59e0b; color: #fde68a; }
  .badge.expired, .badge.disabled, .badge.error { border-color: #ef4444; color: #fecaca; }
  .notice { padding: 0.6rem 0.8rem; border-radius: 10px; margin-bottom: 0.8rem; border: 1px solid rgba(148, 163, 184, 0.3); }
  .notice.error { border-color: #ef4444; color: #fecaca; }
  .notice.ok { border-color: #22c55e; color: #bbf7d0; }
  .notice.warn { border-color: #f59e0b; color: #fde68a; }
  .hidden { display: none; }
  .split { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 1rem; }
  .list-item { padding: 0.55rem 0.6rem; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .list-item.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.08); }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ol.sequence { margin: 0; padding-left: 1.4rem; }
  ol.sequence li { padding: 0.2rem 0; }
  @media (max-width: 800px) { .split { grid-template-columns: 1fr; } body { padding: 1rem; } }
</style>
