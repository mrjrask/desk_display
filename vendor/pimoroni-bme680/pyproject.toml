[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bme680"
dynamic = ["version"]
description = "Python library for the BME680 temperature, humidity and gas sensor"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">= 3.7"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
maintainers = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
keywords = [
    "Pi",
    "Raspberry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware",
]
dependencies = [
    "smbus2",
]

[project.urls]
GitHub = "https://www.github.com/pimoroni/bme680-python"
Homepage = "https://www.pimoroni.com"

[tool.setuptools.packages.find]
include = ["bme680*"]

[tool.setuptools.dynamic]
version = {attr = "bme680.__version__"}
