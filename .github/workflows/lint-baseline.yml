name: Lint suppression baseline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_lint_baseline.py
