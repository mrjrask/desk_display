name: Image assets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-image-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python tools/check_image_assets.py
